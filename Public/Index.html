<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JARVIS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>JARVIS</h1>
      <span>● ONLINE</span>
    </header>

    <main id="chat">

      <div class="jarvis message">
        Hello! I'm JARVIS. How can I help you?
      </div>

    </main>

    <form id="form">

      <input
        id="input"
        placeholder="Ask JARVIS..."
        autocomplete="off"
      >

      <button type="submit">
        ➤
      </button>

    </form>

  </div>

  <script src="app.js"></script>

</body>
</html>
